<!DOCTYPE html>
<html>
<head>
    <title>Debug API</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>API Debug Tool</h1>

    <div class="test">
        <h3>1. Test GET /api/config</h3>
        <button onclick="testGetConfig()">Test</button>
        <pre id="get-config-result">Waiting...</pre>
    </div>

    <div class="test">
        <h3>2. Test PUT /api/config (update)</h3>
        <button onclick="testUpdateConfig()">Test</button>
        <pre id="update-config-result">Waiting...</pre>
    </div>

    <div class="test">
        <h3>3. Test POST /api/config/save</h3>
        <button onclick="testSaveConfig()">Test</button>
        <pre id="save-config-result">Waiting...</pre>
    </div>

    <div class="test">
        <h3>4. Test Provider Save (Combined)</h3>
        <button onclick="testProviderSave()">Test</button>
        <pre id="provider-save-result">Waiting...</pre>
    </div>

    <div class="test">
        <h3>5. Test GET /api/system/info</h3>
        <button onclick="testSystemInfo()">Test</button>
        <pre id="system-info-result">Waiting...</pre>
    </div>

    <div class="test">
        <h3>6. Test GET /api/daemon/status</h3>
        <button onclick="testDaemonStatus()">Test</button>
        <pre id="daemon-status-result">Waiting...</pre>
    </div>

    <script>
        const API_BASE = '/api';

        async function testGetConfig() {
            const result = document.getElementById('get-config-result');
            try {
                result.textContent = 'Loading...';
                const response = await fetch(`${API_BASE}/config`);
                const data = await response.json();
                result.textContent = `Status: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                result.parentElement.classList.add('success');
            } catch (e) {
                result.textContent = `Error: ${e.message}`;
                result.parentElement.classList.add('error');
            }
        }

        async function testUpdateConfig() {
            const result = document.getElementById('update-config-result');
            try {
                result.textContent = 'Loading...';
                const response = await fetch(`${API_BASE}/config`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ default_provider: 'zai', default_model: 'test-model' })
                });
                const data = await response.json();
                result.textContent = `Status: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                result.parentElement.classList.add('success');
            } catch (e) {
                result.textContent = `Error: ${e.message}`;
                result.parentElement.classList.add('error');
            }
        }

        async function testSaveConfig() {
            const result = document.getElementById('save-config-result');
            try {
                result.textContent = 'Loading...';
                const response = await fetch(`${API_BASE}/config/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                result.textContent = `Status: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                result.parentElement.classList.add('success');
            } catch (e) {
                result.textContent = `Error: ${e.message}`;
                result.parentElement.classList.add('error');
            }
        }

        async function testProviderSave() {
            const result = document.getElementById('provider-save-result');
            try {
                result.textContent = 'Loading...';
                console.log('[API] PUT /api/config with provider data');

                // First update
                const updateResponse = await fetch(`${API_BASE}/config`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        providers: {
                            zai: {
                                api_key: 'test-key-123',
                                base_url: 'https://api.zai.com',
                                model: 'zai-model'
                            }
                        }
                    })
                });
                console.log('[API] Update response status:', updateResponse.status);
                const updateData = await updateResponse.json();
                console.log('[API] Update response data:', updateData);

                // Then save
                const saveResponse = await fetch(`${API_BASE}/config/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                console.log('[API] Save response status:', saveResponse.status);
                const saveData = await saveResponse.json();
                console.log('[API] Save response data:', saveData);

                result.textContent = `Update: ${updateResponse.status}\n${JSON.stringify(updateData, null, 2)}\n\nSave: ${saveResponse.status}\n${JSON.stringify(saveData, null, 2)}`;
                result.parentElement.classList.add('success');
            } catch (e) {
                result.textContent = `Error: ${e.message}\n\nStack: ${e.stack}`;
                result.parentElement.classList.add('error');
            }
        }

        async function testSystemInfo() {
            const result = document.getElementById('system-info-result');
            try {
                result.textContent = 'Loading...';
                const response = await fetch(`${API_BASE}/system/info`);
                const data = await response.json();
                result.textContent = `Status: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                result.parentElement.classList.add('success');
            } catch (e) {
                result.textContent = `Error: ${e.message}`;
                result.parentElement.classList.add('error');
            }
        }

        async function testDaemonStatus() {
            const result = document.getElementById('daemon-status-result');
            try {
                result.textContent = 'Loading...';
                const response = await fetch(`${API_BASE}/daemon/status`);
                const data = await response.json();
                result.textContent = `Status: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                result.parentElement.classList.add('success');
            } catch (e) {
                result.textContent = `Error: ${e.message}`;
                result.parentElement.classList.add('error');
            }
        }

        // Auto-run tests on page load
        window.addEventListener('load', () => {
            console.log('Debug page loaded. Click buttons to test APIs.');
        });
    </script>
</body>
</html>
